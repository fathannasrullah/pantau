name: Probe calon sumber

# Alat pemeriksaan, bukan bagian dari deploy: dijalankan saat daftar calon
# sumbernya berubah, atau manual dari tab Actions. Hasilnya terbit sebagai
# annotation pada run ini.
on:
  push:
    paths:
      - scripts/probe-sources.mjs
      - .github/workflows/probe-sources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-sources.mjs
