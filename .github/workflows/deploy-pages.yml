name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  # Snapshot sumber resmi ikut terbit tiap deploy, jadi situsnya di-build ulang
  # berkala supaya angkanya tidak basi. Cron GitHub sifatnya best-effort dan
  # bisa telat beberapa menit; app menandai sendiri data yang mulai basi.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan satu deploy berjalan sampai selesai; antrean yang menumpuk dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Konfigurasi Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm test

      # Sumber resmi tidak mengirim header CORS, jadi pengambilannya dilakukan
      # di sini, bukan dari browser. Gagal di sini tidak boleh membuat situs
      # ikut hilang — app menandai sendiri sumber yang kosong.
      - name: Ambil data sumber resmi
        run: npm run fetch:data
        continue-on-error: true

      # base_path berisi "/nama-repo" untuk project site, dan kosong atau "/"
      # untuk user site seperti gunungfire.github.io. Menempelkan "/" begitu
      # saja menghasilkan "//" pada kasus kedua, jadi jalurnya dirapikan dulu.
      - name: Build
        run: |
          BASE='${{ steps.pages.outputs.base_path }}'
          case "$BASE" in
            ''|'/') BASE='/' ;;
            */)     ;;
            *)      BASE="$BASE/" ;;
          esac
          echo "VITE_BASE=$BASE"
          VITE_BASE="$BASE" npm run build
        env:
          # Kode situs GoatCounter, diisi lewat repository variable bernama
          # GOATCOUNTER (Settings → Secrets and variables → Actions →
          # Variables). Bukan rahasia — kode itu memang terlihat di permintaan
          # yang dikirim peramban — tapi ditaruh di sana supaya bisa diganti
          # atau dimatikan tanpa menyentuh kode. Kosong berarti penghitungnya
          # mati total: app tidak mengirim permintaan apa pun ke luar.
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
